  method for tool discovery. Checkout requires contemporaneous human buyer approval; the endpoint is rate-limited
  per IP (back off on 429). Tool names below are documented in the store's /llms.txt "Typical Agent Flow";
  call tools/list against the endpoint for authoritative schemas.
