aid: innovist
name: Innovist
description: >-
  Innovist is an Accel-backed, science-backed direct-to-consumer personal care
  house based in India, building and operating a portfolio of skincare, haircare
  and suncare brands including Chemist At Play, Bare Anatomy and Sunscoop. It
  sells direct to consumers through a Shopify-powered online store at
  innovist.com, offering free delivery and category-wide discounts across skin,
  hair and sun care. While Innovist does not publish a traditional developer
  API program, its storefront natively implements agent-facing commerce
  surfaces: a customer-account OpenID Connect identity layer, a published
  llms.txt / agents.md for AI shopping assistants, and a Universal Commerce
  Protocol (UCP) MCP endpoint that lets approved agents search the catalog,
  build carts and complete buyer-approved checkouts.
